# Render blueprint. "New > Blueprint" against this repository creates the
# service from the Dockerfile, which already builds the panel and the API into
# one image. The free instance sleeps after 15 minutes of no traffic and takes
# about a minute to wake, which is the trade for costing nothing.
services:
  - type: web
    name: rag-assistant
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # The hosted demo runs with no API key: the mock model composes its answer
      # from the retrieved text, and the store is in memory.
      - key: LLM_PROVIDER
        value: mock
      - key: EMBEDDER
        value: local
      - key: VECTOR_STORE
        value: memory
      - key: PYTHONUNBUFFERED
        value: "1"
